name: Pull request

# This fork keeps the upstream jobs that can run on a personal-account fork:
# - "Soundness" (license headers, API breakage, format checks) via swiftlang's reusable workflow.
# - "Check compatibility with real world projects" formats swift-format, swift-syntax and
#   sourcekit-lsp with the swift-format binary built from this PR.
# The upstream "Test"/"cmake-smoke-test" matrix jobs (swift_package_test.yml reusable workflow)
# fail at startup on personal-account forks, so build/test coverage lives in ci.yml instead:
# build-and-test-macos, build-and-test-linux and lint-selfformat are the required checks.

permissions:
  contents: read

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  soundness:
    name: Soundness
    uses: swiftlang/github-workflows/.github/workflows/soundness.yml@0.0.15
    with:
      license_header_check_project_name: "Swift.org"
      # This fork adds additional formatting rules, so the API
      # breakage check against upstream tags cannot pass; it also crashes on fork checkouts.
      api_breakage_check_enabled: false
      # The unacceptable-language check script fails to run in this fork's environment; language
      # is covered by review and the other checks.
      unacceptable_language_check_enabled: false
  compatibility_check:
    # Format a list of real-world projects that enforce formatting using the latest swift-format version.
    name: Check compatibility with real world projects
    runs-on: ubuntu-latest
    container:
      image: swift:6.2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Mark the workspace as safe
        # https://github.com/actions/checkout/issues/766
        run: git config --global --add safe.directory ${GITHUB_WORKSPACE}
      - name: Check out related PRs
        run: |
          apt-get update && apt-get install -y curl
          curl -s https://raw.githubusercontent.com/swiftlang/github-workflows/refs/heads/main/.github/workflows/scripts/cross-pr-checkout.swift > /tmp/cross-pr-checkout.swift
          swift /tmp/cross-pr-checkout.swift "${{ github.repository }}" "${{ github.event.number }}"
      - name: Build
        run: |
          swift build --configuration release
      - name: Add local swift-format to PATH
        run: |
          # Add the locally built version of swift-format to PATH so it gets picked up by check-swift-format.sh
          echo "PATH=$(pwd)/.build/release:$PATH" >> "$GITHUB_ENV"
      - name: Download check format script
        run: |
          curl https://raw.githubusercontent.com/swiftlang/github-workflows/refs/heads/main/.github/workflows/scripts/check-swift-format.sh > /tmp/check-swift-format.sh
          chmod +x /tmp/check-swift-format.sh
      - name: Format swift-format
        run: |
          cd "$GITHUB_WORKSPACE"
          /tmp/check-swift-format.sh
      - name: Checkout swift-syntax
        uses: actions/checkout@v6
        with:
          repository: swiftlang/swift-syntax
          persist-credentials: false
          path: swift-syntax
      - name: Format swift-syntax
        run: |
          cd "$GITHUB_WORKSPACE/swift-syntax"
          /tmp/check-swift-format.sh
      - name: Checkout sourcekit-lsp
        uses: actions/checkout@v6
        with:
          repository: swiftlang/sourcekit-lsp
          persist-credentials: false
          path: sourcekit-lsp
      - name: Format sourcekit-lsp
        run: |
          cd "$GITHUB_WORKSPACE/sourcekit-lsp"
          /tmp/check-swift-format.sh
