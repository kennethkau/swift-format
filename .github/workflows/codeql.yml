name: CodeQL

# Advanced CodeQL setup: the repository must not use code scanning default setup at the same
# time (uploads from advanced configurations are rejected while default setup is enabled), so
# this workflow covers all languages. Swift requires a macOS runner and an SPM build; the other
# languages run on Linux, where the C target of _SwiftFormatInstructionCounter is traced through
# a plain `swift build` (CodeQL autobuild has no Swift recipe).

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

jobs:
  analyze-swift:
    name: Analyze (swift)
    runs-on: macos-latest
    timeout-minutes: 90
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: swift
          queries: security-extended
      - name: Build
        uses: github/codeql-action/autobuild@v3
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  analyze-other:
    name: Analyze (c-cpp, actions, python)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: c-cpp, actions, python
      - name: Report toolchain
        run: swift --version
      - name: Build
        run: swift build
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
